<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ringfall — agent-03 prototype</title>
<style>
  :root {
    color-scheme: dark;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #070910;
    color: #f4f7ff;
  }
  #wrap { position: relative; width: 100%; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .hud {
    position: absolute;
    inset: 18px 18px auto 18px;
    display: flex;
    justify-content: space-between;
    gap: 16px;
    pointer-events: none;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    font-size: 13px;
  }
  .pill {
    padding: 9px 12px;
    border: 1px solid rgba(255,255,255,.13);
    background: rgba(8,12,22,.62);
    border-radius: 999px;
    backdrop-filter: blur(10px);
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    text-align: center;
    background: radial-gradient(circle at center, rgba(8,13,25,.32), rgba(5,7,12,.82));
  }
  .card {
    max-width: 560px;
    padding: 30px;
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(7,10,18,.76);
    border-radius: 24px;
    backdrop-filter: blur(16px);
    box-shadow: 0 18px 80px rgba(0,0,0,.35);
  }
  h1 { margin: 0 0 8px; font-size: clamp(42px, 10vw, 82px); line-height: .9; letter-spacing: -.055em; }
  p { margin: 12px 0; color: #c8d0e2; line-height: 1.55; }
  .small { font-size: 13px; opacity: .78; }
  button {
    margin-top: 14px;
    appearance: none;
    border: 0;
    border-radius: 999px;
    padding: 12px 20px;
    font: inherit;
    font-weight: 800;
    background: #eef3ff;
    color: #0a0d14;
    cursor: pointer;
  }
  button:hover { transform: translateY(-1px); }
  .legend { display: flex; justify-content: center; gap: 20px; margin-top: 16px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 8px; color: #dfe6f7; font-size: 14px; }
  .dot, .tri { width: 13px; height: 13px; display: inline-block; }
  .dot { border-radius: 50%; background: #7cf6d5; box-shadow: 0 0 14px rgba(124,246,213,.45); }
  .tri {
    width: 0; height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-bottom: 13px solid #ff6d88;
    filter: drop-shadow(0 0 8px rgba(255,109,136,.42));
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" aria-label="Ringfall game canvas"></canvas>
  <div class="hud">
    <div class="pill">Score <span id="score">0</span></div>
    <div class="pill">Core <span id="energy">● ● ●</span></div>
    <div class="pill" id="state">Live · P pause</div>
  </div>
  <div id="overlay">
    <div class="card">
      <h1>RINGFALL</h1>
      <p>Orbit the collector. Catch incoming <strong>signals</strong>. Let the <strong>hazards</strong> pass. Protect the core as the ring accelerates.</p>
      <div class="legend">
        <span><i class="dot"></i> catch circles</span>
        <span><i class="tri"></i> avoid triangles</span>
      </div>
      <button id="start">Start run</button>
      <p class="small">A/D or ←/→ · mouse/touch also works · P pauses · Space restarts</p>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const startButton = document.getElementById("start");
  const scoreEl = document.getElementById("score");
  const energyEl = document.getElementById("energy");
  const stateEl = document.getElementById("state");
  const reduceMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches ?? false;

  let W = 0, H = 0, DPR = 1, cx = 0, cy = 0;
  let running = false;
  let paused = false;
  let last = performance.now();
  let elapsed = 0;
  let spawnClock = 0;
  let score = 0;
  let energy = 3;
  let angle = -Math.PI / 2;
  let pointerAngle = null;
  let shake = 0;
  const keys = new Set();
  const particles = [];
  const sparks = [];

  const TAU = Math.PI * 2;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2;
    cy = H / 2;
  }

  function arenaRadius() {
    return Math.max(100, Math.min(W, H) * 0.31);
  }

  function normalize(a) {
    while (a > Math.PI) a -= TAU;
    while (a < -Math.PI) a += TAU;
    return a;
  }

  function reset() {
    score = 0;
    energy = 3;
    paused = false;
    elapsed = 0;
    spawnClock = 0;
    particles.length = 0;
    sparks.length = 0;
    angle = -Math.PI / 2;
    scoreEl.textContent = "0";
    energyEl.textContent = "● ● ●";
    stateEl.textContent = "Live · P pause";
    running = true;
    overlay.style.display = "none";
    last = performance.now();
  }

  function gameOver() {
    running = false;
    paused = false;
    stateEl.textContent = "Run over";
    overlay.style.display = "grid";
    overlay.querySelector("h1").textContent = "RUN OVER";
    overlay.querySelector("p").innerHTML = `Final score: <strong>${score}</strong>. The ring always wants another round.`;
    startButton.textContent = "Run it back";
  }

  function damage() {
    if (!running || energy <= 0) return;
    energy = Math.max(0, energy - 1);
    shake = reduceMotion ? 0 : 12;
    energyEl.textContent = Array.from({ length: 3 }, (_, i) => i < energy ? "●" : "○").join(" ");
    if (energy <= 0) gameOver();
  }

  function spawn() {
    const hazardChance = Math.min(0.18 + elapsed / 150, 0.42);
    const hazard = Math.random() < hazardChance;
    const r = Math.hypot(W, H) * 0.58;
    particles.push({
      a: Math.random() * TAU,
      r,
      speed: 85 + Math.min(elapsed * 1.7, 155) + Math.random() * 28,
      hazard,
      size: hazard ? 8 : 7,
      checked: false,
      spin: (Math.random() * 2 - 1) * 2.8
    });
  }

  function burst(a, r, hazard) {
    const count = reduceMotion ? 3 : 10;
    for (let i = 0; i < count; i++) {
      sparks.push({
        x: cx + Math.cos(a) * r,
        y: cy + Math.sin(a) * r,
        vx: Math.cos(a + (Math.random() - .5) * 1.8) * (40 + Math.random() * 95),
        vy: Math.sin(a + (Math.random() - .5) * 1.8) * (40 + Math.random() * 95),
        life: .35 + Math.random() * .25,
        hazard
      });
    }
  }

  function update(dt) {
    if (!running || paused) return;
    elapsed += dt;
    shake *= Math.pow(.03, dt);

    const ring = arenaRadius();
    const turnSpeed = 2.7;
    if (keys.has("ArrowLeft") || keys.has("KeyA")) angle -= turnSpeed * dt;
    if (keys.has("ArrowRight") || keys.has("KeyD")) angle += turnSpeed * dt;

    if (pointerAngle !== null) {
      const d = normalize(pointerAngle - angle);
      angle += d * Math.min(1, dt * 10);
    }

    spawnClock -= dt;
    const interval = Math.max(.26, .92 - elapsed * .009);
    if (spawnClock <= 0) {
      spawn();
      spawnClock = interval * (.78 + Math.random() * .45);
    }

    const arcHalf = .24;
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.r -= p.speed * dt;

      if (!p.checked && p.r <= ring + 12) {
        p.checked = true;
        const hit = Math.abs(normalize(p.a - angle)) < arcHalf;

        if (hit && !p.hazard) {
          score += 10 + Math.floor(elapsed / 12);
          scoreEl.textContent = String(score);
          burst(p.a, p.r, false);
          particles.splice(i, 1);
          continue;
        }

        if (hit && p.hazard) {
          burst(p.a, p.r, true);
          particles.splice(i, 1);
          damage();
          continue;
        }
      }

      if (p.r < 26) {
        if (!p.hazard) damage();
        particles.splice(i, 1);
      }
    }

    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.life -= dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vx *= Math.pow(.08, dt);
      s.vy *= Math.pow(.08, dt);
      if (s.life <= 0) sparks.splice(i, 1);
    }
  }

  function drawBackground() {
    const g = ctx.createRadialGradient(cx, cy, 10, cx, cy, Math.max(W, H) * .65);
    g.addColorStop(0, "#101a30");
    g.addColorStop(.55, "#090d18");
    g.addColorStop(1, "#05070c");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = "rgba(160,185,235,.08)";
    ctx.lineWidth = 1;
    const ring = arenaRadius();
    for (let i = 1; i <= 3; i++) {
      ctx.beginPath();
      ctx.arc(cx, cy, ring * i / 3, 0, TAU);
      ctx.stroke();
    }
  }

  function draw() {
    ctx.save();
    if (shake > .25) {
      ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    }

    drawBackground();

    const ring = arenaRadius();

    ctx.strokeStyle = "rgba(191,214,255,.18)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, ring, 0, TAU);
    ctx.stroke();

    const coreGlow = ctx.createRadialGradient(cx, cy, 2, cx, cy, 46);
    coreGlow.addColorStop(0, "rgba(166,203,255,.95)");
    coreGlow.addColorStop(.2, "rgba(99,147,255,.45)");
    coreGlow.addColorStop(1, "rgba(99,147,255,0)");
    ctx.fillStyle = coreGlow;
    ctx.beginPath();
    ctx.arc(cx, cy, 46, 0, TAU);
    ctx.fill();

    ctx.fillStyle = "#e9f1ff";
    ctx.beginPath();
    ctx.arc(cx, cy, 6, 0, TAU);
    ctx.fill();

    for (const p of particles) {
      const x = cx + Math.cos(p.a) * p.r;
      const y = cy + Math.sin(p.a) * p.r;
      ctx.save();
      ctx.translate(x, y);
      if (p.hazard) {
        ctx.rotate(elapsed * p.spin);
        ctx.fillStyle = "#ff6d88";
        ctx.shadowColor = "rgba(255,109,136,.7)";
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.moveTo(0, -p.size - 2);
        ctx.lineTo(p.size + 2, p.size);
        ctx.lineTo(-p.size - 2, p.size);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillStyle = "#7cf6d5";
        ctx.shadowColor = "rgba(124,246,213,.85)";
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(0, 0, p.size, 0, TAU);
        ctx.fill();
      }
      ctx.restore();
    }

    ctx.save();
    ctx.strokeStyle = "#f3f7ff";
    ctx.shadowColor = "rgba(210,226,255,.8)";
    ctx.shadowBlur = 18;
    ctx.lineWidth = 8;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.arc(cx, cy, ring, angle - .24, angle + .24);
    ctx.stroke();

    const px = cx + Math.cos(angle) * ring;
    const py = cy + Math.sin(angle) * ring;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(px, py, 6, 0, TAU);
    ctx.fill();
    ctx.restore();

    for (const s of sparks) {
      ctx.globalAlpha = Math.max(0, s.life * 2.2);
      ctx.fillStyle = s.hazard ? "#ff8aa0" : "#9bffe4";
      ctx.fillRect(s.x - 1.5, s.y - 1.5, 3, 3);
    }
    ctx.globalAlpha = 1;

    if (running) {
      ctx.fillStyle = "rgba(235,241,255,.52)";
      ctx.font = "600 12px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(paused ? "PAUSED · PRESS P TO RESUME" : "CATCH CIRCLES · AVOID TRIANGLES", cx, cy + ring + 44);
    }

    if (paused && running) {
      ctx.fillStyle = "rgba(5,7,12,.58)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#f4f7ff";
      ctx.font = "800 28px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("PAUSED", cx, cy - 4);
      ctx.fillStyle = "rgba(235,241,255,.72)";
      ctx.font = "500 14px system-ui, sans-serif";
      ctx.fillText("Press P to resume", cx, cy + 24);
    }

    ctx.restore();
  }

  function frame(now) {
    const dt = Math.min((now - last) / 1000, .033);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  function setPointer(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left - cx;
    const y = e.clientY - rect.top - cy;
    pointerAngle = Math.atan2(y, x);
  }

  window.addEventListener("resize", resize);
  window.addEventListener("keydown", e => {
    keys.add(e.code);
    if (["ArrowLeft", "ArrowRight", "Space", "KeyP"].includes(e.code)) e.preventDefault();
    if (["ArrowLeft", "ArrowRight", "KeyA", "KeyD"].includes(e.code)) pointerAngle = null;
    if (e.code === "KeyP" && running) {
      paused = !paused;
      stateEl.textContent = paused ? "Paused · P resume" : "Live · P pause";
    }
    if (e.code === "Space" && !running) reset();
  });
  window.addEventListener("keyup", e => keys.delete(e.code));
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && running && !paused) {
      paused = true;
      stateEl.textContent = "Paused · P resume";
    }
  });
  canvas.addEventListener("pointermove", setPointer);
  canvas.addEventListener("pointerdown", e => {
    setPointer(e);
    if (!running) reset();
  });
  canvas.addEventListener("pointerleave", () => pointerAngle = null);
  startButton.addEventListener("click", reset);

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
