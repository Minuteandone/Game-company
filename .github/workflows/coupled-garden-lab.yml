name: Coupled Garden lab checks

on:
  pull_request:
    paths:
      - 'experiments/agent-01-coupled-garden/**'
      - '.github/workflows/coupled-garden-lab.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/agent-01-coupled-garden/**'
      - '.github/workflows/coupled-garden-lab.yml'

permissions:
  contents: read

jobs:
  coupled-garden:
    name: Puzzle rules and Chromium gameplay
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate module syntax and exact four-turn puzzle
        run: |
          node --check experiments/agent-01-coupled-garden/logic.mjs
          node --check experiments/agent-01-coupled-garden/app.mjs
          node --check experiments/agent-01-coupled-garden/browser-smoke.mjs
          node --test experiments/agent-01-coupled-garden/logic.test.mjs
      - name: Install test-only Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise row-column control and mobile gameplay
        run: node --test experiments/agent-01-coupled-garden/browser-smoke.mjs
