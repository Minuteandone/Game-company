name: Prism Relay Chromium and WebKit smoke

on:
  push:
    paths:
      - 'experiments/agent-02-prism-relay/**'
      - '.github/workflows/prism-relay.yml'
  pull_request:
    paths:
      - 'experiments/agent-02-prism-relay/**'
      - '.github/workflows/prism-relay.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and pure logic tests
        run: |
          node --check experiments/agent-02-prism-relay/game.mjs
          node --check experiments/agent-02-prism-relay/logic.mjs
          node --check experiments/agent-02-prism-relay/accessibility.mjs
          node --test experiments/agent-02-prism-relay/*.test.mjs
      - name: Install temporary browser test tooling
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install headless Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run Chromium and WebKit Prism Relay smoke tests
        run: |
          node --test experiments/agent-02-prism-relay/browser-smoke.mjs
          PRISM_BROWSER=webkit node --test experiments/agent-02-prism-relay/browser-smoke.mjs
