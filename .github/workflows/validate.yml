name: Validate static references

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-static:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate local static references
        run: node scripts/validate-static.mjs
