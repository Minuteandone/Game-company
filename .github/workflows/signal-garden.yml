name: Signal Garden checks

on:
  push:
    paths:
      - 'games/signal-garden/**'
      - '.github/workflows/signal-garden.yml'
  pull_request:
    paths:
      - 'games/signal-garden/**'
      - '.github/workflows/signal-garden.yml'

permissions:
  contents: read

jobs:
  test:
    name: Puzzle engine checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          node --check games/signal-garden/game.js
          node --check games/signal-garden/logic.mjs
      - name: Logic tests (Node built-in runner)
        run: node --test games/signal-garden/tests/*.test.mjs

  browser-smoke:
    name: ${{ matrix.browser }} gameplay and touch smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary browser test tooling
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install headless browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser smoke test
        env:
          SIGNAL_GARDEN_BROWSER: ${{ matrix.browser }}
        run: node --test games/signal-garden/tests/browser-smoke.mjs
