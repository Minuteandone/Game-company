name: Pulse Garden browser checks

on:
  push:
    paths:
      - 'prototypes/agent-04-pulse-garden/**'
      - 'experiments/agent-04-pulse-voices/**'
      - '.github/workflows/pulse-garden.yml'
  pull_request:
    paths:
      - 'prototypes/agent-04-pulse-garden/**'
      - 'experiments/agent-04-pulse-voices/**'
      - '.github/workflows/pulse-garden.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Chromium gameplay smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary browser test tooling
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke test
        run: node --test prototypes/agent-04-pulse-garden/tests/browser-smoke.mjs experiments/agent-04-pulse-voices/tests/browser-smoke.mjs
