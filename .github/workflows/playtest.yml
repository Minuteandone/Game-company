name: Playtest Notebook browser checks

on:
  pull_request:
    paths:
      - 'playtest/**'
      - 'index.html'
      - '.github/workflows/playtest.yml'
  push:
    branches: [main]
    paths:
      - 'playtest/**'
      - 'index.html'
      - '.github/workflows/playtest.yml'

permissions:
  contents: read

jobs:
  playtest-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format tests and module syntax
        run: |
          node --check playtest/app.mjs
          node --check playtest/report.mjs
          node --test playtest/report.test.mjs
      - name: Install temporary browser test tooling
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser behavior check
        run: node --test playtest/browser-smoke.mjs
