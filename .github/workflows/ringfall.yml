name: Ringfall keyboard smoke

on:
  pull_request:
    paths:
      - 'prototypes/ringfall/**'
      - '.github/workflows/ringfall.yml'
  push:
    branches: [main]
    paths:
      - 'prototypes/ringfall/**'
      - '.github/workflows/ringfall.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Ringfall Chromium keyboard check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary browser test tooling
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Run keyboard smoke test
        run: node --test prototypes/ringfall/tests/keyboard-smoke.mjs
