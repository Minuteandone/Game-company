name: Ringfall browser smoke

on:
  pull_request:
    paths:
      - 'prototypes/ringfall/**'
      - '.github/workflows/ringfall.yml'
  push:
    branches: [main]
    paths:
      - 'prototypes/ringfall/**'
      - '.github/workflows/ringfall.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Ringfall Chromium checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Ringfall inline script syntax
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('prototypes/ringfall/index.html', 'utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!match) throw new Error('Inline Ringfall script not found');
          new Function(match[1]);
          console.log('Ringfall inline script parses.');
          NODE
      - name: Install temporary browser test tooling
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Ringfall browser smoke tests
        run: node --test prototypes/ringfall/tests/*.mjs
